openapi: 3.0.3
info:
  title: Chinta Platform API
  version: 1.0.0
  description: Control plane for tenants, users, memberships, and gateway access resolve (v1 admin slice).
paths:
  /health:
    get:
      operationId: health
      summary: Liveness
      responses:
        "200":
          description: OK
  /v1/users:
    post:
      operationId: createUser
      summary: Create platform user (admin)
      responses:
        "201":
          description: Created
        "401":
          description: Unauthorized
  /v1/users/{user_id}:
    get:
      operationId: getUser
      summary: Get platform user by id (admin)
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /v1/users/by-email/{email}:
    get:
      operationId: getUserByEmail
      summary: Get platform user by email (admin)
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/tenants:
    get:
      operationId: listTenants
      summary: List tenants (admin)
      responses:
        "200":
          description: OK
    post:
      operationId: createTenant
      summary: Create tenant and provision notes schema (admin)
      responses:
        "201":
          description: Created
  /v1/tenants/by-slug/{slug}:
    get:
      operationId: getTenantBySlug
      summary: Get tenant by slug (admin)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /v1/tenants/{tenant_id}:
    get:
      operationId: getTenant
      summary: Get tenant by id (admin)
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /v1/tenants/{tenant_id}/memberships:
    get:
      operationId: listMemberships
      summary: List tenant memberships (admin)
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /v1/tenants/{tenant_id}/memberships/{user_id}:
    put:
      operationId: upsertMembership
      summary: Upsert membership (admin)
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
    delete:
      operationId: removeMembership
      summary: Remove membership (admin)
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No content
  /v1/access/resolve:
    post:
      operationId: accessResolve
      summary: Resolve tenant access for gateway (internal)
      responses:
        "200":
          description: Decision
