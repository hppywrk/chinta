openapi: 3.0.0
info:
  title: Chinta API
  version: 1.0.0
  description: Multi-tenant notes editor backend (schema-per-tenant in PostgreSQL)

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /notes:
    get:
      summary: List the current user's notes in the tenant
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notes for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a note
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notes/{note_id}:
    put:
      summary: Replace a note's body text
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: path
          name: note_id
          required: true
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteReplace'
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          description: Note not found for this user
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      summary: Delete a note
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: path
          name: note_id
          required: true
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Note deleted
        '404':
          description: Note not found for this user
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantIdHeader:
      in: header
      name: X-Tenant-Id
      required: true
      schema:
        type: string
      description: Tenant identifier; data is isolated in a dedicated PostgreSQL schema.

  responses:
    Unauthorized:
      description: Missing or invalid access token

  schemas:
    NoteCreate:
      type: object
      required:
        - body
      properties:
        body:
          type: string

    NoteReplace:
      type: object
      required:
        - body
      properties:
        body:
          type: string

    Note:
      type: object
      required:
        - id
        - body
        - modified_at
      properties:
        id:
          type: integer
          format: int64
        body:
          type: string
        modified_at:
          type: string
          format: date-time
