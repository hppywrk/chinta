global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: chinta-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - chinta-auth:8083
          - chinta-gateway:8084
          - chinta-backend:8080
          - chinta-platform:8085
          - chinta-ui:8086
