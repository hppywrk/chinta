name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: pip install pyyaml

      - name: Validate OpenAPI YAML files
        run: python scripts/validate_openapi_specs.py

      - name: Validate CD default services include backend
        run: bash scripts/deploy/test_vm_deploy_services.sh

      - name: Validate chinta-db Dockerfile uses official Postgres
        run: bash scripts/deploy/test_db_dockerfile.sh

  python-services:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chinta-auth/requirements.txt
            chinta-gateway/requirements.txt
            chinta/requirements.txt
            chinta-platform/requirements.txt
            chinta-admin/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chinta-auth/requirements.txt -r chinta-gateway/requirements.txt -r chinta/requirements.txt
          pip install -r chinta-platform/requirements.txt -r chinta-admin/requirements.txt
          pip install pytest

      - name: Run unit tests
        env:
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: |
          cd chinta-auth && pytest -q
          cd ../chinta-gateway && pytest -q
          cd ../chinta && pytest -q test_db_unit.py
          cd ../chinta-platform && pytest -q
          cd ../chinta-admin && pytest -q

      - name: Byte-compile service code
        run: python -m compileall -q chinta-auth chinta-gateway chinta chinta-platform chinta-admin

      - name: Import application modules
        env:
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: |
          cd chinta-auth && python -c "import app"
          cd ../chinta-gateway && python -c "import app"
          cd ../chinta-platform && python -c "import app"

  chinta-backend:
    name: Chinta backend (PostgreSQL)
    runs-on: ubuntu-latest
    needs:
      - openapi
      - python-services
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chinta
          POSTGRES_USER: chinta_user
          POSTGRES_PASSWORD: chinta_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chinta_user -d chinta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chinta/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chinta/requirements.txt -r chinta-platform/requirements.txt pytest

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://chinta_user:chinta_password@localhost:5432/chinta
        run: |
          cd chinta && pytest -q
          cd ../chinta-platform && pytest -q test_migrate.py

  smoke:
    name: Smoke (auth + gateway)
    runs-on: ubuntu-latest
    needs:
      - openapi
      - python-services
      - chinta-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chinta-auth/requirements.txt
            chinta-gateway/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chinta-auth/requirements.txt -r chinta-gateway/requirements.txt

      - name: Start services and probe endpoints
        env:
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: |
          set -euo pipefail
          cd chinta-auth
          uvicorn app:app --host 127.0.0.1 --port 8083 &
          AUTH_PID=$!
          cd ../chinta-gateway
          CHINTA_AUTH_URL=http://127.0.0.1:8083 uvicorn app:app --host 127.0.0.1 --port 8084 &
          GW_PID=$!
          trap 'kill $AUTH_PID $GW_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8083/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8083/health
          curl -sf http://127.0.0.1:8084/health
          curl -sf http://127.0.0.1:8083/openapi.yaml | head -1 | grep -q '^openapi:'
          curl -sf http://127.0.0.1:8084/openapi.yaml | head -1 | grep -q '^openapi:'
          # Do not use -f: /me returns 401 by design; -f would make curl exit 22.
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8084/me | grep -q '401'
