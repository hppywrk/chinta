name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: pip install pyyaml

      - name: Validate OpenAPI YAML files
        run: python scripts/validate_openapi_specs.py

  python-services:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chinta-auth/requirements.txt
            chinta-gateway/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chinta-auth/requirements.txt -r chinta-gateway/requirements.txt

      - name: Byte-compile service code
        run: python -m compileall -q chinta-auth chinta-gateway

      - name: Import application modules
        env:
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: |
          cd chinta-auth && python -c "import app"
          cd ../chinta-gateway && python -c "import app"

  smoke:
    name: Smoke (auth + gateway)
    runs-on: ubuntu-latest
    needs:
      - openapi
      - python-services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chinta-auth/requirements.txt
            chinta-gateway/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chinta-auth/requirements.txt -r chinta-gateway/requirements.txt

      - name: Start services and probe endpoints
        env:
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: |
          set -euo pipefail
          cd chinta-auth
          uvicorn app:app --host 127.0.0.1 --port 8083 &
          AUTH_PID=$!
          cd ../chinta-gateway
          CHINTA_AUTH_URL=http://127.0.0.1:8083 uvicorn app:app --host 127.0.0.1 --port 8084 &
          GW_PID=$!
          trap 'kill $AUTH_PID $GW_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8083/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8083/health
          curl -sf http://127.0.0.1:8084/health
          curl -sf http://127.0.0.1:8083/openapi.yaml | head -1 | grep -q '^openapi:'
          curl -sf http://127.0.0.1:8084/openapi.yaml | head -1 | grep -q '^openapi:'
          curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8084/me | grep -q '401'
