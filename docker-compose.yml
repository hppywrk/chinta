services:

  chinta-db:
    image: postgres:16-alpine
    container_name: chinta-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./chinta-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: chinta
      POSTGRES_USER: chinta_user
      POSTGRES_PASSWORD: chinta_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinta_user -d chinta"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chinta-network

  chinta-auth:
    build:
      context: ./chinta-auth
    container_name: chinta-auth
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-test}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-test}
      OIDC_REDIRECT_URI_BASE: ${OIDC_REDIRECT_URI_BASE:-http://localhost:8083}
    networks:
      - chinta-network

  chinta-notebook:
    build:
      context: ./chinta-notebook
    container_name: chinta-notebook
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      chinta-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chinta_user:chinta_password@chinta-db:5432/chinta
      PORT: "8085"
    networks:
      - chinta-network

  chinta-gateway:
    build:
      context: ./chinta-gateway
    container_name: chinta-gateway
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      - chinta-auth
      - chinta-notebook
    environment:
      CHINTA_AUTH_URL: http://chinta-auth:8083
      CHINTA_NOTEBOOK_URL: http://chinta-notebook:8085
      CHINTA_GATEWAY_PORT: "8084"
    networks:
      - chinta-network

volumes:
  postgres_data:

networks:
  chinta-network:
    driver: bridge
