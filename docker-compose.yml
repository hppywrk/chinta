# Chinta service catalog — single source for local dev and VM CD (docker compose only).
# Deploy: scripts/deploy/vm-deploy.sh or systemd chinta-compose.service

name: chinta

x-chinta-vm:
  default_services:
    - chinta-db
    - chinta-auth
    - chinta-backend
    - chinta-gateway
    - chinta-platform

services:
  chinta-db:
    build:
      context: .
      dockerfile: Dockerfile.cinta-db
    container_name: chinta-db
    restart: unless-stopped
    ports:
      # Localhost only: hardcoded compose credentials must not be reachable
      # from the VM network (vm-deploy uses this same compose file).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Catalog DDL is COPY'd into the image as 01_init.sql (Dockerfile.cinta-db).
      # Do NOT also mount chinta-db/init.sql here: a second apply re-runs bare
      # CREATE INDEX and aborts first-boot init on every fresh volume.
      # Platform control-plane DDL (idempotent). Also applied on chinta-platform startup.
      - ./chinta-platform/migrations/001_platform_core.sql:/docker-entrypoint-initdb.d/02_platform_core.sql:ro
    environment:
      POSTGRES_DB: chinta
      POSTGRES_USER: chinta_user
      POSTGRES_PASSWORD: chinta_password
    networks:
      - chinta-network

  chinta-auth:
    build:
      context: ./chinta-auth
      dockerfile: Dockerfile
    container_name: chinta-auth
    restart: unless-stopped
    ports:
      # Auth is reached via docker DNS from the gateway; host bind is for local probes only.
      - "127.0.0.1:8083:8083"
    env_file:
      - path: ${CHINTA_DEPLOY_ENV:-/etc/chinta/deploy.env}
        required: false
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Public origin for OAuth (gateway :8084). IdP callbacks omit redirect_uri, so
      # auth falls back to {OIDC_REDIRECT_URI_BASE}/auth/callback on code exchange.
      OIDC_REDIRECT_URI_BASE: ${OIDC_REDIRECT_URI_BASE:-http://localhost:8084}
    networks:
      - chinta-network

  chinta-gateway:
    build:
      context: ./chinta-gateway
      dockerfile: Dockerfile
    container_name: chinta-gateway
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      - chinta-auth
      - chinta-backend
      - chinta-platform
    env_file:
      - path: ${CHINTA_DEPLOY_ENV:-/etc/chinta/deploy.env}
        required: false
    environment:
      CHINTA_AUTH_URL: ${CHINTA_AUTH_URL:-http://chinta-auth:8083}
      CHINTA_BACKEND_URL: ${CHINTA_BACKEND_URL:-http://chinta-backend:8080}
      CHINTA_PLATFORM_URL: ${CHINTA_PLATFORM_URL:-http://chinta-platform:8085}
      CHINTA_GATEWAY_PORT: "8084"
    networks:
      - chinta-network

  chinta-platform:
    build:
      context: ./chinta-platform
      dockerfile: Dockerfile
    container_name: chinta-platform
    restart: unless-stopped
    ports:
      # Unauthenticated POST /v1/access/resolve must not be internet-reachable.
      # Admin CLI and local probes use localhost; gateway uses docker DNS.
      - "127.0.0.1:8085:8085"
    depends_on:
      - chinta-db
    environment:
      CHINTA_PLATFORM_DATABASE_URL: postgresql://chinta_user:chinta_password@chinta-db:5432/chinta
      # No insecure compose default: a public :8085 + known token allows granting
      # membership on any tenant. Set explicitly in deploy.env / local shell.
      CHINTA_PLATFORM_ADMIN_TOKEN: ${CHINTA_PLATFORM_ADMIN_TOKEN:-}
      CHINTA_PLATFORM_PORT: "8085"
    networks:
      - chinta-network

  chinta-backend:
    build:
      context: ./chinta
      dockerfile: Dockerfile
    container_name: chinta-backend
    restart: unless-stopped
    ports:
      # Notes API is meant to be reached via gateway; keep host bind loopback-only
      # so a mis-set CHINTA_ENFORCE_PLATFORM cannot be probed from the network.
      - "127.0.0.1:8080:8080"
    depends_on:
      - chinta-db
    environment:
      CHINTA_DB_HOST: chinta-db
      CHINTA_DB_PORT: "5432"
      CHINTA_DB_NAME: chinta
      CHINTA_DB_USER: chinta_user
      CHINTA_DB_PASSWORD: chinta_password
      CHINTA_AUTH_URL: http://chinta-auth:8083
      CHINTA_ENFORCE_PLATFORM: ${CHINTA_ENFORCE_PLATFORM:-1}
    networks:
      - chinta-network

  chinta-net:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: Dockerfile.chinta-net
    container_name: chinta-net
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - chinta-backend
    volumes:
      - ./config:/etc/chinta:ro
    environment:
      CHINTA_BACKEND_URL: http://chinta-backend:8080
    networks:
      - chinta-network

volumes:
  postgres_data:

networks:
  chinta-network:
    driver: bridge
